name: Deploy simulator to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint an id-token for the Pages deployment, write the site.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push that lands
# mid-deploy still ends up published rather than silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22.18+ runs the TypeScript directly, which is what the whole project
      # depends on. Pinning the major keeps that guarantee.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # The site ships a transcription of the engine. If it has drifted from the
      # TypeScript original, that is a wrong answer in front of a real reader —
      # so the deploy fails rather than publishing numbers that disagree with
      # the CLI.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
